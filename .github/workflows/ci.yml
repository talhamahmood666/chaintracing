name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-key-for-ci
          NEXT_PUBLIC_BASE_URL: https://example.com
          ETHERSCAN_API_KEY: dummy-etherscan-key
          SOLSCAN_API_KEY: dummy-solscan-key
          TRONGRID_API_KEY: dummy-trongrid-key
          PLISIO_SECRET_KEY: dummy-plisio-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint
