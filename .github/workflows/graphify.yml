name: Graphify rebuild

on:
  push:
    branches: [main]

jobs:
  rebuild-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graphify
        run: pip install graphifyy==0.4.10

      - name: Rebuild graph (code-only, no LLM)
        env:
          GRAPHIFY_NO_TIPS: "1"
        run: graphify update . || graphify .

      - name: Commit updated graph
        run: |
          git config --local user.name "graphify-bot"
          git config --local user.email "graphify-bot@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_REPORT.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No graph changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-update graphify graph"
          git push
